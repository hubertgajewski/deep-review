stages:
  - test
  - release

variables:
  CI_ENABLED:
    value: "true"
    description: "Set to false to disable automatic CI pipelines."

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_ENABLED == "false"'
      when: never
    - if: "$CI_COMMIT_TAG"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: "$CI_COMMIT_BRANCH"
    - when: never

test:
  stage: test
  parallel:
    matrix:
      - PYTHON_IMAGE:
          - "python:3.10-slim@sha256:c1e4e6c01eb489c422288b2de34b0761ca316f7a2d98e2c33f47659a73ed108a"
          - "python:3.14-slim@sha256:cea0e6040540fb2b965b6e7fb5ffa00871e632eef63719f0ea54bca189ce14a6"
  image: "$PYTHON_IMAGE"
  interruptible: true
  timeout: 5m
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git
  script:
    - python -m unittest discover -s tests -v

installer_powershell_test:
  stage: test
  image:
    name: "mcr.microsoft.com/powershell:7.4-ubuntu-22.04@sha256:62300a213a9293916333df2b014cd3a8f22fb0b0b65f2bb446aaf436bcf8c868"
    entrypoint: [""]
  interruptible: true
  timeout: 5m
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends python3
  script:
    - python3 -m unittest tests.test_installers -v

prepare_claude_submission:
  stage: release
  image: "python:3.14-slim@sha256:cea0e6040540fb2b965b6e7fb5ffa00871e632eef63719f0ea54bca189ce14a6"
  interruptible: true
  timeout: 10m
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: false
    - when: never
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git nodejs npm
    - npm install --global "@anthropic-ai/claude-code@2.1.216"
  script:
    - test "$(git cat-file -t "$CI_COMMIT_TAG")" = "tag"
    - test "$(git rev-parse "$CI_COMMIT_TAG^{commit}")" = "$CI_COMMIT_SHA"
    - git fetch --no-tags origin "refs/heads/main:refs/remotes/origin/main"
    - git merge-base --is-ancestor "$CI_COMMIT_SHA" origin/main
    - test "$CI_COMMIT_TAG" = "v$(python -c 'import json; print(json.load(open("skills/deep-review/.claude-plugin/plugin.json"))["version"])')"
    - python -m unittest discover -s tests -v
    - claude plugin validate --strict skills/deep-review
    - git archive --format=tar.gz --prefix=deep-review/ --output="deep-review-$CI_COMMIT_TAG.tar.gz" "$CI_COMMIT_TAG:skills/deep-review"
    - git archive --format=zip --prefix=deep-review/ --output="deep-review-$CI_COMMIT_TAG.zip" "$CI_COMMIT_TAG:skills/deep-review"
    - sha256sum "deep-review-$CI_COMMIT_TAG.tar.gz" > "deep-review-$CI_COMMIT_TAG.tar.gz.sha256"
    - sha256sum "deep-review-$CI_COMMIT_TAG.zip" > "deep-review-$CI_COMMIT_TAG.zip.sha256"
    - sha256sum deep-review-install.sh > deep-review-install.sh.sha256
    - sha256sum deep-review-install.ps1 > deep-review-install.ps1.sha256
  artifacts:
    name: "deep-review-$CI_COMMIT_TAG"
    paths:
      - "deep-review-$CI_COMMIT_TAG.tar.gz"
      - "deep-review-$CI_COMMIT_TAG.tar.gz.sha256"
      - "deep-review-$CI_COMMIT_TAG.zip"
      - "deep-review-$CI_COMMIT_TAG.zip.sha256"
      - "deep-review-install.sh"
      - "deep-review-install.sh.sha256"
      - "deep-review-install.ps1"
      - "deep-review-install.ps1.sha256"
    expire_in: 30 days

publish_release:
  stage: release
  image: "python:3.14-slim@sha256:cea0e6040540fb2b965b6e7fb5ffa00871e632eef63719f0ea54bca189ce14a6"
  interruptible: false
  timeout: 5m
  resource_group: "release-$CI_COMMIT_TAG"
  needs:
    - job: prepare_claude_submission
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  script:
    - >-
      python scripts/publish_release.py
      --api-url "$CI_API_V4_URL"
      --project-id "$CI_PROJECT_ID"
      --project-url "$CI_PROJECT_URL"
      --tag "$CI_COMMIT_TAG"
      "deep-review-$CI_COMMIT_TAG.tar.gz"
      "deep-review-$CI_COMMIT_TAG.tar.gz.sha256"
      "deep-review-$CI_COMMIT_TAG.zip"
      "deep-review-$CI_COMMIT_TAG.zip.sha256"
      deep-review-install.sh
      deep-review-install.sh.sha256
      deep-review-install.ps1
      deep-review-install.ps1.sha256
